<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Genre | Movie Finder</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header class="navbar">

    <a href="./index.html" class="navbar__logo">
        <img src="./assets/imdb-logo.png" alt="IMDb">
    </a>

    <div class="navbar__info">

        <form class="search-box" id="searchForm">

            <input
                id="searchInput"
                type="search"
                placeholder="Search IMDb"
                aria-label="Search movies"
            >

            <button
                type="submit"
                aria-label="Search"
            >
                🔍
            </button>

        </form>

        <button
            class="genres-button"
            type="button"
        >
            <span>Genres</span>
            <span>⌄</span>
        </button>

    </div>

</header>

<main class="genre-page">

    <section class="genre-header">

        <h1 id="genreTitle">
            Action Movies
        </h1>

    </section>

    <section class="genre-movies">

        <div
            id="genreMovies"
            class="movies-grid"
        ></div>

        <div
            id="genreLoading"
            class="genre-loading"
        >
            Loading movies...
        </div>

        <div
            id="genreError"
            class="genre-error"
        ></div>

        <div
            id="genreEmpty"
            class="genre-empty"
        >
            No movies found.
        </div>

    </section>

    <nav
        id="genrePagination"
        class="pagination"
        aria-label="Genre movie pages"
    >
    </nav>

</main>

<footer class="footer">

    <p>
        © 2025 by Karyar Studio
    </p>

</footer>

<script
    type="module"
    src="./js/genre.js"
></script>

</body>

</html>
