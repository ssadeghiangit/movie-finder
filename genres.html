<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Genres | IMDb</title>
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/search-bar.js"></script>
    <script type="module" src="./js/genres.js"></script>
    <script type="module" src="./js/genres-list.js"></script>
</head>
<body>
    <header class="navbar">
        <a href="./index.html" class="navbar__logo">
            <img src="./assets/IMDB logo.svg" alt="IMDb">
        </a>

        <div class="navbar__info">
            <div class="search-wrapper">
                <form class="search-box" id="searchForm">
                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Search IMDb"
                        aria-label="Search movies"
                    >
                    <button type="submit" aria-label="Search">
                        <span aria-hidden="true">⌕</span>
                    </button>
                </form>
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>

            <div class="genres-wrapper">
                <a href="./genres.html" class="genres-link">Genres</a>
                <button
                    class="genres-button"
                    id="genresButton"
                    type="button"
                    aria-label="Open genres menu"
                    aria-expanded="false"
                    aria-controls="genresDropdown"
                >
                    <span aria-hidden="true">⌄</span>
                </button>
                <div class="genres-dropdown" id="genresDropdown"></div>
            </div>
        </div>
    </header>

    <main class="genres-list-page">
        <section class="genre-header">
            <h1>Genres</h1>
        </section>

        <div class="genres-layout">
            <aside class="genres-sidebar">
                <nav
                    id="genreList"
                    class="genre-list"
                    aria-label="Movie genres"
                ></nav>
            </aside>

            <section class="genre-content">
                <div class="genre-content__header">
                    <div class="sort-control">
                        <span class="sort-control__label">Sort by:</span>
                        <button
                            id="sortButton"
                            class="sort-control__button"
                            type="button"
                            aria-label="Sort by ranking, highest first"
                            aria-pressed="false"
                        >
                            <span>Ranking</span>
                            <span class="arrow" aria-hidden="true">↓</span>
                        </button>
                    </div>

                    <span id="genreMovieCount" aria-live="polite">Movies</span>
                </div>

                <div
                    id="genreMovies"
                    class="genre-movies"
                    aria-live="polite"
                >
                    Loading movies...
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 by Karyar Studio</p>
    </footer>
</body>
</html>
