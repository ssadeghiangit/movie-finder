
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details | Movie Finder</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header class="navbar">

        <a href="./index.html" class="navbar__logo">
            <img src="./assets/IMDB logo.svg" alt="IMDb Logo">
        </a>

        <div class="navbar__info">

            <div class="genres-wrapper">

                <button
                    type="button"
                    class="genres-button"
                    id="genresButton"
                    aria-expanded="false"
                    aria-controls="genresDropdown"
                >
                    <span>Genres</span>

                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        aria-hidden="true"
                    >
                        <path
                            d="M6 9L12 15L18 9"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </button>

                <div
                    id="genresDropdown"
                    class="genres-dropdown"
                ></div>

            </div>

            <div class="search-wrapper">

                <form class="search-box" id="searchForm">

                    <button type="submit" aria-label="Search">
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >
                            <circle
                                cx="11"
                                cy="11"
                                r="7"
                                stroke="currentColor"
                                stroke-width="2"
                            />
                            <path
                                d="M16 16L21 21"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>

                    <input
                        type="search"
                        id="searchInput"
                        name="query"
                        placeholder="Search movies..."
                        autocomplete="off"
                        aria-label="Search movies"
                    >

                </form>

                <div
                    id="searchDropdown"
                    class="search-dropdown"
                ></div>

            </div>

        </div>

    </header>

    <main class="movie-details">

        <section
            id="detailsLoading"
            class="loading-message"
            aria-live="polite"
        >
            Loading movie details...
        </section>

        <section
            id="detailsError"
            class="error-message"
            role="alert"
            hidden
        ></section>

        <section
            id="detailsEmpty"
            class="empty-message"
            hidden
        >
            No movie details found.
        </section>

        <section
            id="movieDetails"
            class="movie-details__content"
            hidden
        >

            <!-- Movie heading and rating -->
            <div class="movie-details__header">

                <div class="movie-details__heading">

                    <h1
                        id="movieTitle"
                        class="movie-details__title"
                    ></h1>

                    <p
                        id="movieTagline"
                        class="movie-details__tagline"
                    ></p>

                    <div
                        id="movieMeta"
                        class="movie-details__meta"
                    ></div>

                </div>

                <div class="movie-details__rating">

                    <span class="movie-details__rating-label">
                        IMDb RATING
                    </span>

                    <div class="movie-details__rating-value">

                        <svg
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="#F5C518"
                            aria-hidden="true"
                        >
                            <path
                                d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
                            />
                        </svg>

                        <span id="movieRating"></span>

                    </div>

                </div>

            </div>

            <!-- Poster and movie information -->
            <div class="movie-details__overview">

                <div class="movie-details__poster">

                    <img
                        id="moviePoster"
                        src=""
                        alt=""
                    >

                </div>

                <div class="movie-details__information">

                    <div class="movie-details__row">
                        <h2>Genre</h2>
                        <div
                            id="movieGenres"
                            class="movie-details__genres"
                        ></div>
                    </div>

                    <div class="movie-details__row movie-details__plot">
                        <h2>Plot</h2>
                        <p id="movieOverview"></p>
                    </div>

                    <div class="movie-details__row">
                        <h2>Director</h2>
                        <p id="movieDirector"></p>
                    </div>

                    <div class="movie-details__row">
                        <h2>Writers</h2>
                        <p id="movieWriters"></p>
                    </div>

                    <div class="movie-details__row">
                        <h2>Stars</h2>
                        <p id="movieStars"></p>
                    </div>

                    <div
                        id="movieGallery"
                        class="movie-details__gallery"
                    ></div>

                </div>

            </div>

            <!-- Cast section: Figma Frame 51 -->
            <section class="cast-section">

                <div class="cast-section__header">

                    <h2 class="cast-section__title">
                        <span
                            class="cast-section__accent"
                            aria-hidden="true"
                        ></span>
                        Cast
                    </h2>

                </div>

                <div
                    id="movieCast"
                    class="cast-section__list"
                    aria-label="Movie cast"
                ></div>

            </section>

        </section>

    </main>

    <script type="module" src="./js/search-bar.js"></script>
    <script type="module" src="./js/genres.js"></script>
    <script type="module" src="./js/details.js"></script>

</body>

</html>
