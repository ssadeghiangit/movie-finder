<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Finder</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header class="navbar">

    <a href="/" class="navbar__logo">
        <img src="./assets/IMDB logo.svg" alt="IMDb">
    </a>

    <div class="navbar__info">

        <div class="search-wrapper">

            <form class="search-box" id="searchForm">

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search IMDb"
                    aria-label="Search movies"
                >
<button type="submit" aria-label="Search">
    <svg
        width="18"
        height="18"
        viewBox="0 0 18 18"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        focusable="false"
    >
        <path
            d="M12.5006 11.0006H11.7106L11.4306 10.7306C12.6306 9.33063 13.2506 7.42063 12.9106 5.39063C12.4406 2.61063 10.1206 0.390626 7.32063 0.0506256C3.09063 -0.469374 -0.469374 3.09063 0.0506256 7.32063C0.390626 10.1206 2.61063 12.4406 5.39063 12.9106C7.42063 13.2506 9.33063 12.6306 10.7306 11.4306L11.0006 11.7106V12.5006L15.2506 16.7506C15.6606 17.1606 16.3306 17.1606 16.7406 16.7506C17.1506 16.3406 17.1506 15.6706 16.7406 15.2606L12.5006 11.0006ZM6.50063 11.0006C4.01063 11.0006 2.00063 8.99063 2.00063 6.50063C2.00063 4.01063 4.01063 2.00063 6.50063 2.00063C8.99063 2.00063 11.0006 4.01063 11.0006 6.50063C11.0006 8.99063 8.99063 11.0006 6.50063 11.0006Z"
            fill="#797979"
        />
    </svg>
</button>
            </form>

            <div
                class="search-dropdown"
                id="searchDropdown"
            ></div>

        </div>

<div class="genres-wrapper">

    <a
        href="./genres.html"
        class="genres-link"
    >
        Genres
    </a>

    <button
        class="genres-button"
        id="genresButton"
        type="button"
        aria-label="Open genres menu"
        aria-expanded="false"
        aria-controls="genresDropdown"
    >
        <span aria-hidden="true">⌄</span>
    </button>

    <div
        class="genres-dropdown"
        id="genresDropdown"
    ></div>

</div>

    </div>

</header>


<main>

    <section class="hero">

        <img
            class="hero__poster"
            src=""
            alt=""
        >

        <div class="hero__left-fade"></div>
        <div class="hero__bottom-fade"></div>

        <div class="hero__details">

            <h1 class="hero__title">
                Dune: Part Two
            </h1>

            <div class="hero__genres">

                <span class="genre-tag">
                    Action
                </span>

                <span class="genre-tag">
                    Adventure
                </span>

                <span class="genre-tag">
                    Drama
                </span>

            </div>

            <p class="hero__synopsis">
                Paul Atreides unites with Chani and the Fremen while
                seeking revenge against the conspirators who destroyed
                his family.
            </p>

            <p class="hero__status">
                In theaters
            </p>

        </div>
        <div
    class="hero__pagination"
    id="heroPagination"
    aria-label="Choose featured movie"
>
</div>

    </section>


    <section class="movies-content">

    <div
        id="homeLoading"
        class="home-loading"
    >
        Loading movies...
    </div>

    <div
        id="homeError"
        class="home-error"
        hidden
    ></div>

    <div
        id="homeEmpty"
        class="home-empty"
        hidden
    >
        No movies found.
    </div>

    <div class="top-picks"></div>


        <nav
            id="homePagination"
            class="pagination"
            aria-label="Home Movie pages"
        >

            <button
                class="pagination__arrow"
                type="button"
            >
                ←
            </button>

            <button
                class="pagination__page pagination__page--active"
                type="button"
            >
                1
            </button>

            <button
                class="pagination__page"
                type="button"
            >
                2
            </button>

            <button
                class="pagination__page"
                type="button"
            >
                3
            </button>

            <span class="pagination__ellipsis">
                ...
            </span>

            <button
                class="pagination__page"
                type="button"
            >
                25
            </button>

            <button
                class="pagination__arrow"
                type="button"
            >
                →
            </button>

        </nav>

    </section>

</main>


<footer class="footer">

    <p>
        © 2025 by Karyar Studio
    </p>

</footer>


<script type="module" src="./js/home.js"></script>
<script type="module" src="./js/genres.js"></script>
<script type="module" src="./js/search-bar.js"></script>

</body>
</html>
